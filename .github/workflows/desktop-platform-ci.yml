name: desktop-platform-ci

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Electron43's supported build baseline; no namespace policy or SUID changes.
          # This hosted image retires on2027-04-17 and needs replacement before then.
          - os: ubuntu-22.04
            runtime: linux-x64
            bridge-script: bridge:publish:linux
            bridge-executable: SoulForge.Bridge
            builder-platform: linux
            package-directory: linux-unpacked
            headless: '1'
          - os: windows-2022
            runtime: win-x64
            bridge-script: bridge:publish
            bridge-executable: SoulForge.Bridge.exe
            builder-platform: win
            package-directory: win-unpacked
            headless: '0'
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      SF_E2E_HEADLESS: ${{ matrix.headless }}
      SOULFORGE_BUILD_TIMEOUT_MS: '900000'
      SOULFORGE_SMOKE_TIMEOUT_MS: '120000'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
      # Runner paths exist after scheduling; GITHUB_ENV makes them available to later actions.
      - name: Configure job-owned SDK and workspace directories
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/soulforge-dotnet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SF_E2E_WORKSPACE_STORAGE_ROOT=%s/soulforge-workspaces\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.100'
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Verify pinned runtime versions
        id: tools
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; assert.equal(process.versions.node, "22.22.0"); assert.equal(JSON.parse(readFileSync("node_modules/electron/package.json", "utf8")).version, "43.0.0");'
          test "$(dotnet --version)" = "10.0.100"
      - name: Check Bridge command projections
        id: commands
        run: npm run bridge:commands:check
      - name: Typecheck shared/core/desktop
        id: typecheck
        run: npm run typecheck
      - name: Select preinstalled Linux C++ toolchain for Electron headers
        if: runner.os == 'Linux'
        run: |
          clang-15 --version
          clang++-15 --version
          printf 'CC=clang-15\nCXX=clang++-15\n' >> "$GITHUB_ENV"
      # Build only production bundles, avoiding legacy release/governance aggregates.
      - name: Build production bundles and Electron native binding
        id: build
        run: |
          npm run build -w @soulforge/shared
          npm run build -w @soulforge/core
          npm run build -w @soulforge/desktop
      - name: Run real C# Bridge tests
        id: csharp
        run: npm run test:bridge-csharp
      - name: Publish matching-host self-contained Bridge
        id: publish
        run: npm run ${{ matrix.bridge-script }}
      - name: Run deterministic Agent kernel and host fixtures
        id: agent
        run: |
          npm test -w @soulforge/agent
          node --test scripts/agent-shared-entry.fixture.mjs scripts/agent-headless.fixture.mjs scripts/agent-utility.fixture.mjs scripts/agent-kernel-comparison.fixture.mjs scripts/real-agent-evaluator.fixture.mjs
      - name: Run native runtime and synthetic Bridge fixtures
        id: native
        env:
          SOULFORGE_BRIDGE_PATH: ${{ github.workspace }}/bridge/SoulForge.Bridge/bin/Release/net10.0/${{ matrix.runtime }}/publish/${{ matrix.bridge-executable }}
          SOULFORGE_BRIDGE_EXE: ${{ github.workspace }}/bridge/SoulForge.Bridge/bin/Release/net10.0/${{ matrix.runtime }}/publish/${{ matrix.bridge-executable }}
        run: |
          node --test scripts/tae-identity.fixture.mjs scripts/hks-native-platform.fixture.mjs scripts/bridge-linux-production.fixture.mjs scripts/native-build-environment.fixture.mjs
          node scripts/verify-bridge-write-boundary-gate.mjs
      - name: Record Windows native bootstrap boundaries
        if: runner.os == 'Windows'
        run: |
          node --test scripts/windows-bootstrap-diagnostic.test.mjs
          node scripts/windows-bootstrap-diagnostic.mjs
      - name: Run sandbox-preserving Electron database utility smoke
        id: database
        run: |
          node --test scripts/desktop-test-build.test.mjs
          node scripts/run-database-utility-smoke.mjs
      - name: Build unsigned desktop package directory
        id: package
        if: ${{ !cancelled() && steps.commands.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success' && steps.publish.outcome == 'success' }}
        working-directory: apps/desktop
        run: npx --yes electron-builder@26.16.1 --${{ matrix.builder-platform }} --x64 --dir --publish never
      # tar preserves executable modes inside the Linux artifact.
      - name: Archive package directory
        id: archive
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          mkdir -p output
          tar -czf output/SoulForge-${{ matrix.runtime }}.tar.gz -C apps/desktop/release ${{ matrix.package-directory }}
      - name: Report actual public outcomes and unavailable acceptance
        if: always()
        env:
          CI_RUNTIME: ${{ matrix.runtime }}
          CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
          CI_PACKAGE_ARCHIVE: output/SoulForge-${{ matrix.runtime }}.tar.gz
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-public-report.mjs
      - name: Upload package and public verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SoulForge-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            output/SoulForge-${{ matrix.runtime }}.tar.gz
            output/ci-public-${{ matrix.runtime }}.json
          if-no-files-found: error
          retention-days: 14
