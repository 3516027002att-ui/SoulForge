name: windows-ci

on:
  push:
    branches: [main, master, agent/frontend-renovation]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      installer:
        description: Run unsigned NSIS and installer lifecycle acceptance
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
      installer: ${{ steps.scope.outputs.installer }}
      tiers: ${{ steps.scope.outputs.tiers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks from changed paths
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_INSTALLER: ${{ inputs.installer || false }}
          CI_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-change-scope.mjs

  verify:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Freshness checks need the Evidence anchor's Git ancestry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.build == 'true'
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: node scripts/verify.mjs --audit
      # One build includes the database smoke entry. That smoke verifies source
      # and output fingerprints before reusing this exact artifact.
      - name: Build shared production artifacts
        if: needs.changes.outputs.build == 'true'
        run: node scripts/ensure-agent-production-build.mjs --database-smoke
      - name: Public checks (single execution plan)
        env:
          VERIFY_TIERS: ${{ needs.changes.outputs.tiers }}
          SOULFORGE_CONTRACT_REQUIRE_BUNDLES: '1'
        run: node scripts/verify.mjs --tier $env:VERIFY_TIERS --require-tier governance,unit --require-suite test:renderer-e2e --json-out output/verify-ci-public.json --timeout-ms 1200000
      # Public runners have no private corpus. Keep the honest skip reports.
      - name: Native honest-skip contracts
        if: needs.changes.outputs.build == 'true'
        run: |
          node scripts/verify.mjs --tier native --filter private-native-gate --json-out output/verify-ci-native-private.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify.mjs --tier native --filter section28-sekiro-gate --json-out output/verify-ci-native-section28.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify.mjs --tier native --filter me3-sekiro-session --json-out output/verify-ci-native-me3.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-verification
          path: |
            apps/desktop/e2e/playwright/playwright-report/
            apps/desktop/e2e/playwright/test-results/
            output/verify-ci-*.json
          if-no-files-found: ignore

  installer:
    needs: [changes, verify]
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # Rebuild in isolation without test-only entrypoints for the release checks.
      - run: npm run bridge:publish
      - run: npm run build
      - name: Build unsigned NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --yes electron-builder@26.16.1 --win nsis
      - run: npm run release:installer:manifest
      - name: Package integrity and reproducibility
        run: |
          node scripts/verify.mjs --tier release --filter release- --exclude release:manifest,release:installer:manifest,test:release-cross-machine --json-out output/verify-ci-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify.mjs --tier release --filter portable-packaging --json-out output/verify-ci-portable.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify.mjs --suite test:packaged-bridge-runtime --require-executed --json-out output/verify-ci-packaged-bridge.json
      - name: Installer lifecycle (execute mode)
        env:
          SOULFORGE_INSTALLER_LIFECYCLE_RUN: '1'
        run: node scripts/verify.mjs --tier release --filter installer-lifecycle --require-executed --json-out output/verify-ci-installer.json
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-verification
          path: output/verify-ci-*.json
          if-no-files-found: ignore
