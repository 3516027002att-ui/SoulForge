name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: Also run renderer e2e, owned update installers, NSIS and installer lifecycle
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The merge gate. This is the required check; it runs exactly `npm run gate`.
  gate:
    # Keep native Electron builds on the same verified MSVC baseline as desktop CI.
    runs-on: windows-2022
    # A local gate takes about 20 minutes; the hosted runner was 2-3x slower on the old pipeline.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Gate
        env:
          # Trust-zone isolation compares against the merge-base with this commit.
          TRUST_ZONE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/gate.mjs
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate
          path: output/gate-checks.json
          if-no-files-found: ignore

  # Not part of the merge gate: needs packaged installers and a desktop session.
  extended:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.extended
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run bridge:publish
      - run: npm run build
      - name: Prepare owned A/B update installers
        run: |
          npm install --prefix .local-validation/update-tools --no-audit --no-fund --ignore-scripts --no-package-lock electron-builder@26.16.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/update/prepare-owned-installers.mjs --allow-owned-installation
      - name: Renderer e2e and owned update lifecycle
        run: node scripts/check.mjs --suite test:renderer-e2e,test:update:installed,test:update:all --require-executed --json-out output/verify-ci-extended.json --timeout-ms 2700000
      - name: Build unsigned NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --yes electron-builder@26.16.1 --win nsis
      - run: npm run release:installer:manifest
      - name: Package integrity and installer lifecycle
        env:
          SOULFORGE_INSTALLER_LIFECYCLE_RUN: '1'
        run: |
          node scripts/check.mjs --tier release --filter release- --exclude release:manifest,release:installer:manifest,test:release-cross-machine --json-out output/verify-ci-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --tier release --filter portable-packaging --json-out output/verify-ci-portable.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --suite test:packaged-bridge-runtime,test:first-party-schema-package --require-executed --json-out output/verify-ci-package.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --tier release --filter installer-lifecycle --require-executed --json-out output/verify-ci-installer.json
      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-verification
          path: |
            apps/desktop/e2e/playwright/playwright-report/
            apps/desktop/e2e/playwright/test-results/
            output/verify-ci-*.json
            output/update/
          if-no-files-found: ignore
