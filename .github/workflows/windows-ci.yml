name: windows-ci

on:
  push:
    branches: [main, master, agent/frontend-renovation]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      installer:
        description: Run unsigned NSIS and installer lifecycle acceptance
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
      installer: ${{ steps.scope.outputs.installer }}
      tiers: ${{ steps.scope.outputs.tiers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks from changed paths
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_INSTALLER: ${{ inputs.installer || false }}
          CI_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-change-scope.mjs

  platform-coverage:
    needs: changes
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: clang-15
      CXX: clang++-15
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Build matching-source Linux inputs
        run: |
          npm run build -w @soulforge/shared
          npm run build -w @soulforge/core
          npm run bridge:publish:linux
      - name: Execute required counterpart cases
        env:
          SOULFORGE_TAE_PIN_CONTROL_PRODUCT: ${{ github.workspace }}
        run: |
          check_exit=0
          node scripts/check.mjs --suite workspace:@soulforge/core:test:bridge-platform-launch,file:packages/core/src/cli/localCliSession.storage.test.ts,file:scripts/bridge-build-output-ownership.test.mjs,file:scripts/hks-native-platform.fixture.mjs,file:scripts/owned-process.test.mjs,file:scripts/scene/independent-tae-fields.test.mjs,file:scripts/agent-domain-service.fixture.mjs,file:scripts/stale-validation.fixture.mjs --require-executed --case-evidence --json-out output/verify-ci-linux-cases.json || check_exit=$?
          CHECK_EXIT="$check_exit" node --input-type=module -e 'import assert from "node:assert/strict";import {readFileSync} from "node:fs";const r=JSON.parse(readFileSync("output/verify-ci-linux-cases.json","utf8"));assert.equal(process.env.CHECK_EXIT,r.ok?"0":"1");if(r.counts.failed||r.counts.not_run)process.exitCode=1;'
      - name: Upload actual counterpart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-platform-cases
          path: output/verify-ci-linux-cases.json
          if-no-files-found: error

  verify:
    needs: [changes, platform-coverage]
    # Keep native Electron builds on the same verified MSVC baseline as desktop CI.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # Production artifacts contain production entries only. Database checks
      # build their own isolated smoke output through desktop-test-build.mjs.
      - name: Build shared production artifacts
        if: needs.changes.outputs.build == 'true'
        run: node scripts/ensure-agent-production-build.mjs
      - name: Build owned same-source update installers
        run: |
          node scripts/ensure-agent-production-build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run launcher:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools = Join-Path $env:RUNNER_TEMP 'soulforge-update-builder'
          npm install --prefix $tools --no-save --package-lock=false electron-builder@26.16.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $owned = Join-Path $env:RUNNER_TEMP ('soulforge-update-' + [guid]::NewGuid().ToString('N'))
          node scripts/update/prepare-owned-installers.mjs --output-root $owned --builder-cli (Join-Path $tools 'node_modules/electron-builder/cli.js') --approve-execute --timeout-ms 1500000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SOULFORGE_UPDATE_INSTALLED_MANIFEST=$(Join-Path $owned 'manifest.json')" >> $env:GITHUB_ENV
      - name: Public checks (single execution plan)
        # Preserve the strict result, then resolve only proven counterpart cases
        # and owner-approved missing private inputs in the required merge step.
        continue-on-error: true
        env:
          VERIFY_TIERS: ${{ needs.changes.outputs.tiers }}
          REQUIRE_E2E: ${{ needs.changes.outputs.build }}
          SOULFORGE_CONTRACT_REQUIRE_BUNDLES: '1'
        run: |
          $required = @()
          if ($env:REQUIRE_E2E -eq 'true') { $required = @('--require-suite', 'test:renderer-e2e') }
          node scripts/check.mjs --tier $env:VERIFY_TIERS --require-tier governance,unit @required --case-evidence --allow-missing-private-corpus --json-out output/verify-ci-public.json --timeout-ms 2700000
      - uses: actions/download-artifact@v4
        with:
          name: required-platform-cases
          path: output/platform-coverage
      - name: Require actual combined coverage
        run: node scripts/verify/merge-check-reports.mjs output/verify-ci-public.json output/platform-coverage/verify-ci-linux-cases.json --allow-missing-private-corpus --json-out output/verify-ci-combined.json
      # Public runners have no private corpus. Keep the honest skip reports.
      - name: Native honest-skip contracts
        if: needs.changes.outputs.build == 'true'
        run: |
          node scripts/check.mjs --tier native --filter private-native-gate --json-out output/verify-ci-native-private.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --tier native --filter section28-sekiro-gate --json-out output/verify-ci-native-section28.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --tier native --filter me3-sekiro-session --json-out output/verify-ci-native-me3.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-verification
          path: |
            apps/desktop/e2e/playwright/playwright-report/
            apps/desktop/e2e/playwright/test-results/
            .local-validation/public-renderer-e2e/
            output/verify-ci-*.json
            output/platform-coverage/verify-ci-linux-cases.json
            output/update/
          if-no-files-found: ignore

  installer:
    needs: [changes, verify]
    if: needs.changes.outputs.installer == 'true'
    # Keep native Electron builds on the same verified MSVC baseline as desktop CI.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # Rebuild in isolation without test-only entrypoints for the release checks.
      - run: npm run bridge:publish
      - run: npm run build
      - name: Build unsigned NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --yes electron-builder@26.16.1 --win nsis
      - run: npm run release:installer:manifest
      - name: Package integrity and reproducibility
        run: |
          node scripts/check.mjs --tier release --filter release- --exclude release:manifest,release:installer:manifest,test:release-cross-machine --json-out output/verify-ci-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --tier release --filter portable-packaging --json-out output/verify-ci-portable.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --suite test:packaged-bridge-runtime --require-executed --json-out output/verify-ci-packaged-bridge.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs --suite test:first-party-schema-package --require-executed --json-out output/verify-ci-schema-package.json
      - name: Installer lifecycle (execute mode)
        env:
          SOULFORGE_INSTALLER_LIFECYCLE_RUN: '1'
        run: node scripts/check.mjs --tier release --filter installer-lifecycle --require-executed --json-out output/verify-ci-installer.json
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-verification
          path: output/verify-ci-*.json
          if-no-files-found: ignore
